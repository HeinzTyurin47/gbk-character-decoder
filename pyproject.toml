[project]
name = "gbk-character-decoder"
version = "0.1.0"
description = "Decodes and encodes Chinese text using the GBK character encoding standard, a superset of GB2312."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
